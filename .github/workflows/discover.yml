name: discover
on:
  schedule:
    - cron: "11 1 * * 0"     # weekly: find new company job boards via Common Crawl
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scrape
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install httpx
      - run: python -m scraper.discover
      - run: |
          git config user.name "flowhunt-bot"
          git config user.email "flowhunt-bot@users.noreply.github.com"
          git add data/companies.json
          git commit -m "boards: refresh company list" || exit 0
          git pull --rebase -X ours || true
          git push
